<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Redirecting...</title>
    <script>
      const basePath = '/donrua-home'
      const route = window.location.pathname.slice(basePath.length)
      const requestedUrl = `${route}${window.location.search}${window.location.hash}` || '/'
      window.location.replace(`${basePath}/?__route=${encodeURIComponent(requestedUrl)}`)
    </script>
  </head>
  <body></body>
</html>
